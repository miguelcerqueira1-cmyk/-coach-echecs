name: Vérifier et publier

# - pull request : vérification seule
# - push sur main (ou lancement manuel) : vérification, déploiement du Worker
#   Cloudflare (si les secrets sont présents), publication GitHub Pages,
#   puis test du site réellement publié (chargement du moteur compris).
# Le jeu de données « Élite » est collecté à part (elite.yml → branche donnees-elite) ;
# la publication en embarque simplement la dernière copie (repli si le dépôt est injoignable).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions sur Node 24 (checkout v7, setup-node v7, upload-artifact v7, configure-pages v6,
# upload-pages-artifact v5, deploy-pages v5) ; runner épinglé sur Ubuntu 24.04 pendant la
# migration d'ubuntu-latest. Les jobs e2e/online tournent dans l'image Playwright (noble = 24.04).
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Vérification (tests unitaires, Worker, navigateur)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: worker
      - name: Tests unitaires (règles, continuité, import/export)
        run: npm test
      - name: Répertoire revérifié par Stockfish (pièges et réfutations, profondeur 18)
        run: node scripts/verify-repertoire.mjs --all --dry
      - name: Tests du Worker (auth, CORS, limites) avec Claude simulé
        run: npm test
        working-directory: worker
      - name: Construction du site
        run: npm run build

  # Navigateurs déjà installés dans l'image officielle de Playwright (même version que
  # package.json) : plus d'installation de paquets système, qui se bloquait sur GitHub.
  e2e:
    name: Tests de bout en bout (vrai Stockfish, Chromium + WebKit/iPhone)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tests fonctionnels en formule Pro : répertoire complet publié dans le site de test.
      - run: npm run build
        env:
          FULL_CONTENT: '1'
      - name: Tests de bout en bout
        run: npx playwright test
        env:
          WITH_WEBKIT: '1'
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: playwright-report/
          retention-days: 7

  worker:
    name: Déploiement du Worker Cloudflare (API Claude, licences Pro)
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
      claude: ${{ steps.secrets.outputs.claude }}
    steps:
      - name: Présence des secrets
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC: ${{ secrets.ANTHROPIC_API_KEY }}
          CODE: ${{ secrets.COACH_ACCESS_CODE }}
          LICENCE: ${{ secrets.LICENCE_SECRET }}
        run: |
          # Worker déployé dès que les secrets Cloudflare existent ; Claude et licences sont
          # chacun facultatifs (leurs routes répondent « non configuré » sans leurs secrets).
          missing=""
          [ -n "$CF_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN"
          [ -n "$CF_ACCOUNT" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::notice::Worker non déployé : secrets manquants :$missing. Le site est publié sans explications Claude ni licences Pro."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$ANTHROPIC" ] && [ -n "$CODE" ]; then
            if [ ${#CODE} -lt 12 ]; then echo "::error::COACH_ACCESS_CODE doit contenir au moins 12 caractères."; exit 1; fi
            echo "claude=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Explications Claude inactives (ANTHROPIC_API_KEY / COACH_ACCESS_CODE absents)."
            echo "claude=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$LICENCE" ] && [ ${#LICENCE} -lt 32 ]; then echo "::error::LICENCE_SECRET doit contenir au moins 32 caractères."; exit 1; fi
          [ -n "$LICENCE" ] || echo "::notice::Licences Pro inactives (secret LICENCE_SECRET et variables LS_STORE_ID / LS_PRODUCT_ID à créer)." 
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "origin=https://${owner}.github.io" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        if: steps.secrets.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ok == 'true'
        with:
          node-version: 22
      # Contenu Pro (fiches complètes) généré depuis le répertoire, embarqué dans le Worker.
      - run: npm ci && node scripts/pro-content.mjs
        if: steps.secrets.outputs.ok == 'true'
      - run: npm ci
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
      - name: Déployer le Worker, puis ses secrets
        id: deploy
        if: steps.secrets.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ACCESS_CODE: ${{ secrets.COACH_ACCESS_CODE }}
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
          LICENCE_SECRET: ${{ secrets.LICENCE_SECRET }}
          LS_STORE: ${{ vars.LS_STORE_ID }}
          LS_PRODUCT: ${{ vars.LS_PRODUCT_ID }}
          ORIGIN: ${{ steps.secrets.outputs.origin }}
          MODEL: ${{ vars.CLAUDE_MODEL || 'claude-opus-5-5' }}
          DAILY: ${{ vars.DAILY_LIMIT || '100' }}
        run: |
          set -o pipefail
          npx wrangler deploy --var "ALLOWED_ORIGINS:$ORIGIN" --var "CLAUDE_MODEL:$MODEL" --var "DAILY_LIMIT:$DAILY" --var "LS_STORE_ID:$LS_STORE" --var "LS_PRODUCT_ID:$LS_PRODUCT" 2>&1 | tee deploy.log
          # Les secrets ne passent ni par la ligne de commande ni par un fichier du dépôt ; seuls
          # ceux qui existent sont envoyés. LICHESS_TOKEN (facultatif) active le relais Opening Explorer.
          node -e 'const e=process.env, s={}; for (const k of ["ANTHROPIC_API_KEY","ACCESS_CODE","LICHESS_TOKEN","LICENCE_SECRET"]) if (e[k]) s[k]=e[k]; process.stdout.write(JSON.stringify(s))' | npx wrangler secret bulk
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::Adresse workers.dev introuvable. Ouvrez une fois « Workers & Pages » dans le tableau de bord Cloudflare pour créer votre sous-domaine workers.dev, puis relancez."
            exit 1
          fi
          echo "deployment-url=$url" >> "$GITHUB_OUTPUT"
          echo "API déployée : $url"

  pages:
    name: Publication GitHub Pages
    needs: [verify, e2e, worker]
    if: always() && github.event_name != 'pull_request' && needs.verify.result == 'success' && needs.e2e.result == 'success' && needs.worker.result != 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/configure-pages@v6
        id: pages-config
        with:
          enablement: true
      # Copie de secours embarquée dans le site (l'application lit d'abord la branche directement).
      - name: Jeu de données Élite (branche donnees-elite, sinon version déjà publiée)
        env:
          SITE: ${{ steps.pages-config.outputs.base_url }}
        run: |
          if git fetch -q --depth=1 origin donnees-elite && git show FETCH_HEAD:elite.json > site/data/elite.json; then
            git show FETCH_HEAD:joueurs.json > site/data/joueurs.json || rm -f site/data/joueurs.json
            echo "Jeu Élite : copie de la branche donnees-elite."
          elif curl -sf --retry 3 "${SITE}/data/elite.json" -o site/data/elite.json; then
            curl -sf --retry 3 "${SITE}/data/joueurs.json" -o site/data/joueurs.json || rm -f site/data/joueurs.json
            echo "::notice::Branche donnees-elite absente : version déjà publiée conservée."
          else
            rm -f site/data/elite.json
            echo "::warning::Jeu de données Élite indisponible : le site est publié sans (bloc « non publié »)."
          fi
      - name: Construire avec l'adresse de l'API
        run: npm run build
        env:
          COACH_API_URL: ${{ needs.worker.outputs.url }}
      # Depuis la v4, les fichiers cachés (.nojekyll) sont exclus par défaut : on les garde.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true
      - id: deployment
        uses: actions/deploy-pages@v5

  online:
    name: Vérification du site publié
    needs: [pages, worker]
    if: always() && needs.pages.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fichiers servis sous le chemin réel du dépôt
        env:
          SITE: ${{ needs.pages.outputs.url }}
        run: |
          node -e '
            const site = process.env.SITE;
            const files = ["", "config.json", "engine/manifest.json", "engine/stockfish.js", "engine/stockfish.wasm", "vendor/chess.js", "js/main.js"];
            (async () => {
              for (const f of files) {
                let code = 0;
                for (let n = 0; n < 6 && code !== 200; n++) {
                  try { code = (await fetch(site + f)).status; } catch { code = 0; }
                  if (code !== 200) await new Promise((r) => setTimeout(r, 10000));
                }
                console.log(`${site}${f} -> ${code}`);
                if (code !== 200) process.exit(1);
              }
              console.log(await (await fetch(site + "config.json")).text());
            })();'
      - name: API Claude en ligne et protégée (sans code → 401)
        if: needs.worker.outputs.url != '' && needs.worker.outputs.claude == 'true'
        env:
          API: ${{ needs.worker.outputs.url }}
        run: |
          node -e 'fetch(process.env.API + "/v1/status").then((r) => { console.log("Sans code :", r.status); process.exit(r.status === 401 ? 0 : 1); })'
      - name: Liens vidéo du répertoire (oEmbed YouTube ; avertissements seulement, jamais bloquant)
        continue-on-error: true
        timeout-minutes: 5
        run: node scripts/verify-videos.mjs
      - name: Parcours réel sur le site publié (moteur compris)
        run: npx playwright test -g "parcours complet|téléphone|panne du moteur|navigation entre les pages|hors connexion|manifeste"
        env:
          BASE_URL: ${{ needs.pages.outputs.url }}
          WITH_WEBKIT: '1'
      - name: Vraies API Lichess depuis le site publié (Cloud Eval, Explorer avec jeton si fourni)
        run: npx playwright test -g "@online" --project=chromium-ordinateur
        env:
          BASE_URL: ${{ needs.pages.outputs.url }}
          ONLINE: '1'
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }}
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-site-publie
          path: playwright-report/
          retention-days: 7
