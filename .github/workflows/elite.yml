name: Données Élite (mise à jour continue)

# Jeu de données « Élite » (parties blitz/rapide du top 50 Lichess et Chess.com, limitées au
# répertoire) publié sur la branche orpheline « donnees-elite » (elite.json + etat.json), que le
# site lit directement via raw.githubusercontent.com. Ni tests, ni Worker, ni republication Pages.
# - toutes les 30 min : passage incrémental (seules les parties terminées depuis le passage précédent) ;
# - chaque lundi (et si l'état manque) : reconstruction complète, seule à écrire aussi l'état neuf.
# Un seul écrivain : ce workflow, sérialisé par son groupe de concurrence.
# Limites : GitHub peut retarder un cron (5 à 20 min fréquents) et désactive les workflows
# planifiés après 60 jours sans commit sur la branche par défaut.
on:
  schedule:
    - cron: '*/30 * * * *'
    - cron: '17 4 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode de collecte'
        type: choice
        options: [incremental, complet]
        default: incremental

permissions:
  contents: read

concurrency:
  group: donnees-elite
  cancel-in-progress: false

jobs:
  collecte:
    name: Collecte Élite (Lichess + Chess.com) → branche donnees-elite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: État précédent (branche donnees-elite)
        run: |
          mkdir -p donnees
          if git fetch -q --depth=1 origin donnees-elite; then
            git show FETCH_HEAD:etat.json > donnees/etat.json || rm -f donnees/etat.json
            git show FETCH_HEAD:elite.json > donnees/precedent-elite.json || true
            cp donnees/etat.json donnees/precedent-etat.json 2>/dev/null || true
          else
            echo "::notice::Branche donnees-elite absente : reconstruction complète."
          fi
      - name: Collecte
        id: collecte
        env:
          LICHESS_TOKEN: ${{ secrets.LICHESS_TOKEN }} # facultatif (débit Lichess plus élevé)
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
        run: |
          if [ "$SCHEDULE" = '17 4 * * 1' ] || [ "$MODE" = complet ] || [ ! -f donnees/etat.json ]; then
            node scripts/elite.mjs --state donnees/etat.json --out donnees/elite.json
          else
            node scripts/elite.mjs --incremental donnees/etat.json --out donnees/elite.json
          fi
      # Branche d'un seul commit, remplacé à chaque fois (force push) : l'historique ne grossit pas.
      - name: Publier sur donnees-elite si les données ont changé
        run: |
          changed=$(node -e '
            const fs = require("fs");
            const read = (f, drop) => { try { const j = JSON.parse(fs.readFileSync(f, "utf8")); drop(j); return JSON.stringify(j); } catch { return null; } };
            const e = (j) => { delete j.meta.generatedAt; delete j.meta.run; for (const x of Object.values(j.meta.sources)) { delete x.requests; delete x.gamesDownloaded; delete x.newGames; } };
            const s = (j) => { delete j.updatedAt; delete j.lastRun; };
            const diff = read("donnees/elite.json", e) !== read("donnees/precedent-elite.json", e)
              || read("donnees/etat.json", s) !== read("donnees/precedent-etat.json", s);
            process.stdout.write(diff ? "oui" : "non");')
          if [ "$changed" != oui ]; then echo "Aucune nouvelle donnée : rien à publier."; exit 0; fi
          msg=$(node -e 'const r=require("./donnees/elite.json").meta.run; process.stdout.write(`Élite : +${r.newGames} parties (${new Date().toISOString().slice(0,16).replace("T"," ")} UTC, ${r.mode})`)')
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME" GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          a=$(git hash-object -w donnees/elite.json)
          b=$(git hash-object -w donnees/etat.json)
          tree=$(printf '100644 blob %s\telite.json\n100644 blob %s\tetat.json\n' "$a" "$b" | git mktree)
          commit=$(git commit-tree "$tree" -m "$msg")
          git push -q -f origin "$commit:refs/heads/donnees-elite"
          echo "$msg"
